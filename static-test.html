<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Widget Test - Static Build</title>
  <!-- Widget CSS (REQUIRED for proper styling) -->
  <link rel="stylesheet" href="./dist/botuyo-chat.umd.css">
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      margin: 0;
      padding: 40px;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      min-height: 100vh;
    }
    h1 { text-align: center; color: white; margin-bottom: 30px; }
    .info {
      max-width: 600px;
      margin: 0 auto;
      background: white;
      padding: 20px;
      border-radius: 12px;
      box-shadow: 0 10px 40px rgba(0,0,0,0.2);
    }
    .info h2 { margin-top: 0; color: #333; }
    .status { padding: 10px 15px; border-radius: 8px; margin-top: 15px; font-weight: 500; }
    .status.connected { background: #d1fae5; color: #065f46; }
    .status.disconnected { background: #fee2e2; color: #991b1b; }
    .status.connecting { background: #fef3c7; color: #92400e; }
    pre {
      background: #1e1e1e; color: #d4d4d4;
      padding: 15px; border-radius: 8px; overflow-x: auto; font-size: 12px;
      max-height: 200px; overflow-y: auto;
    }
    .test-buttons { margin-top: 15px; display: flex; gap: 10px; }
    button { padding: 10px 20px; border-radius: 8px; border: none; cursor: pointer; font-weight: 600; }
    .btn-primary { background: #4f46e5; color: white; }
    .btn-secondary { background: #e5e7eb; color: #374151; }
  </style>
</head>
<body>
  <h1>🧪 Widget Static Test</h1>
  
  <div class="info">
    <h2>📦 UMD Bundle Test</h2>
    <p><strong>Socket:</strong> http://127.0.0.1:9090</p>
    <div id="status" class="status connecting">⏳ Loading widget...</div>
    <div class="test-buttons">
      <button id="btn-open" class="btn-primary">Open Widget</button>
      <button id="btn-close" class="btn-secondary">Close Widget</button>
    </div>
    <pre id="logs">Logs will appear here...</pre>
  </div>

  <!-- Widget Root -->
  <div id="botuyo-chat-widget-root"></div>

  <!-- Load Built UMD Bundle -->
  <script src="./dist/botuyo-chat.umd.js"></script>
  <script>
    const statusEl = document.getElementById('status');
    const logsEl = document.getElementById('logs');
    
    function log(msg) {
      const time = new Date().toLocaleTimeString();
      logsEl.textContent = `[${time}] ${msg}\n` + logsEl.textContent;
    }

    // Wait for widget to load
    const checkInterval = setInterval(() => {
      if (window.BotUyoChat) {
        clearInterval(checkInterval);
        log('✅ BotUyoChat global found!');
        
        try {
          window.BotUyoChat.init({
            apiKey: 'static-test-key',
            apiBaseUrl: 'http://127.0.0.1:9090',
            theme: {
              primaryColor: '#4f46e5',
              botName: 'Test Bot',
              position: 'bottom-right',
              welcomeMessage: 'Hello! I am the test bot.',
              logoUrl: 'https://api.dicebear.com/7.x/bottts/svg?seed=test'
            },
            onStateChange: (isOpen) => {
              log(`Widget ${isOpen ? 'opened' : 'closed'}`);
            }
          });
          
          statusEl.className = 'status connected';
          statusEl.textContent = '✅ Widget initialized';
          log('Widget initialized successfully');

          document.getElementById('btn-open').onclick = () => {
            window.BotUyoChat.open();
          };
          document.getElementById('btn-close').onclick = () => {
            window.BotUyoChat.close();
          };

        } catch (e) {
          log(`❌ Error: ${e.message}`);
          statusEl.className = 'status disconnected';
          statusEl.textContent = '❌ Error: ' + e.message;
        }
      }
    }, 100);

    setTimeout(() => {
      clearInterval(checkInterval);
      if (!window.BotUyoChat) {
        log('❌ Timeout: BotUyoChat not found');
        statusEl.className = 'status disconnected';
        statusEl.textContent = '❌ Widget script not loaded';
      }
    }, 5000);
  </script>
</body>
</html>
