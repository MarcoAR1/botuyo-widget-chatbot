<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>BotUyo Widget Builder</title>
  <link rel="stylesheet" href="./dist/botuyo-chat.umd.css">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: #0f172a;
      color: #e2e8f0;
      min-height: 100vh;
      display: flex;
    }

    /* Sidebar */
    .sidebar {
      width: 360px;
      background: #1e293b;
      border-right: 1px solid #334155;
      height: 100vh;
      overflow-y: auto;
      padding: 24px;
    }

    .sidebar h1 {
      font-size: 20px;
      font-weight: 700;
      margin-bottom: 8px;
      color: #f8fafc;
    }

    .sidebar p {
      font-size: 13px;
      color: #94a3b8;
      margin-bottom: 24px;
    }

    .section {
      margin-bottom: 24px;
    }

    .section-title {
      font-size: 11px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.1em;
      color: #64748b;
      margin-bottom: 12px;
      padding-bottom: 8px;
      border-bottom: 1px solid #334155;
    }

    .field {
      margin-bottom: 16px;
    }

    .field label {
      display: block;
      font-size: 12px;
      font-weight: 600;
      color: #cbd5e1;
      margin-bottom: 6px;
    }

    .field input[type="text"],
    .field input[type="number"],
    .field select {
      width: 100%;
      padding: 10px 12px;
      background: #0f172a;
      border: 1px solid #334155;
      border-radius: 8px;
      color: #f1f5f9;
      font-size: 13px;
      transition: all 0.2s;
    }

    .field input:focus,
    .field select:focus {
      outline: none;
      border-color: #3b82f6;
      box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.2);
    }

    .field input[type="color"] {
      width: 50px;
      height: 36px;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      padding: 0;
    }

    .color-field {
      display: flex;
      gap: 10px;
      align-items: center;
    }

    .color-field input[type="text"] {
      flex: 1;
    }

    .toggle-field {
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .toggle {
      position: relative;
      width: 44px;
      height: 24px;
    }

    .toggle input {
      opacity: 0;
      width: 0;
      height: 0;
    }

    .toggle .slider {
      position: absolute;
      cursor: pointer;
      inset: 0;
      background: #334155;
      border-radius: 24px;
      transition: 0.3s;
    }

    .toggle .slider:before {
      position: absolute;
      content: "";
      height: 18px;
      width: 18px;
      left: 3px;
      bottom: 3px;
      background: white;
      border-radius: 50%;
      transition: 0.3s;
    }

    .toggle input:checked + .slider {
      background: #10b981;
    }

    .toggle input:checked + .slider:before {
      transform: translateX(20px);
    }

    /* Preview area */
    .preview-area {
      flex: 1;
      display: flex;
      flex-direction: column;
    }

    .preview-header {
      background: #1e293b;
      padding: 16px 24px;
      border-bottom: 1px solid #334155;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .preview-header h2 {
      font-size: 14px;
      font-weight: 600;
    }

    .preview-actions {
      display: flex;
      gap: 8px;
    }

    .preview-actions button {
      padding: 8px 16px;
      border-radius: 6px;
      border: none;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s;
    }

    .btn-primary {
      background: #3b82f6;
      color: white;
    }

    .btn-primary:hover {
      background: #2563eb;
    }

    .btn-secondary {
      background: #334155;
      color: #e2e8f0;
    }

    .btn-secondary:hover {
      background: #475569;
    }

    .preview-container {
      flex: 1;
      position: relative;
      background: linear-gradient(135deg, #1e3a5f 0%, #0f172a 100%);
      background-image: 
        radial-gradient(circle at 25% 25%, rgba(59, 130, 246, 0.1) 0%, transparent 50%),
        radial-gradient(circle at 75% 75%, rgba(16, 185, 129, 0.1) 0%, transparent 50%);
    }

    /* Code output */
    .code-section {
      background: #0f172a;
      border-top: 1px solid #334155;
      padding: 16px 24px;
      max-height: 200px;
      overflow: hidden;
    }

    .code-section h3 {
      font-size: 11px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.1em;
      color: #64748b;
      margin-bottom: 12px;
    }

    .code-section pre {
      background: #1e293b;
      padding: 12px;
      border-radius: 8px;
      font-size: 11px;
      overflow-x: auto;
      color: #a5f3fc;
      max-height: 140px;
      overflow-y: auto;
    }

    /* Scrollbar */
    ::-webkit-scrollbar {
      width: 6px;
      height: 6px;
    }

    ::-webkit-scrollbar-track {
      background: transparent;
    }

    ::-webkit-scrollbar-thumb {
      background: #475569;
      border-radius: 3px;
    }

    ::-webkit-scrollbar-thumb:hover {
      background: #64748b;
    }

    /* Preset buttons */
    .presets {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-bottom: 16px;
    }

    .preset-btn {
      padding: 6px 12px;
      border-radius: 6px;
      border: 1px solid #334155;
      background: transparent;
      color: #94a3b8;
      font-size: 11px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s;
    }

    .preset-btn:hover {
      background: #334155;
      color: #f1f5f9;
    }

    .preset-btn.active {
      background: #10b981;
      border-color: #10b981;
      color: white;
    }
  </style>
</head>
<body>
  <!-- Sidebar Controls -->
  <aside class="sidebar">
    <h1>🎨 Widget Builder</h1>
    <p>Personaliza el widget en tiempo real</p>

    <!-- Presets -->
    <div class="section">
      <div class="section-title">Presets</div>
      <div class="presets">
        <button class="preset-btn active" onclick="applyPreset('default')">Default</button>
        <button class="preset-btn" onclick="applyPreset('dark')">Dark</button>
        <button class="preset-btn" onclick="applyPreset('ocean')">Ocean</button>
        <button class="preset-btn" onclick="applyPreset('sunset')">Sunset</button>
        <button class="preset-btn" onclick="applyPreset('forest')">Forest</button>
      </div>
    </div>

    <!-- Colors -->
    <div class="section">
      <div class="section-title">Colores</div>
      
      <div class="field">
        <label>Color Primario</label>
        <div class="color-field">
          <input type="color" id="primaryColor" value="#10b981">
          <input type="text" id="primaryColorText" value="#10b981">
        </div>
      </div>
    </div>

    <!-- Identity -->
    <div class="section">
      <div class="section-title">Identidad</div>
      
      <div class="field">
        <label>Nombre del Bot</label>
        <input type="text" id="botName" value="Asistente Virtual">
      </div>

      <div class="field">
        <label>Logo URL (opcional)</label>
        <input type="text" id="logoUrl" placeholder="https://...">
      </div>

      <div class="field">
        <label>Mensaje de Bienvenida</label>
        <input type="text" id="welcomeMessage" value="¡Hola! 👋 ¿En qué puedo ayudarte?">
      </div>

      <div class="field">
        <label>Placeholder del Input</label>
        <input type="text" id="inputPlaceholder" value="Escribe tu mensaje...">
      </div>
    </div>

    <!-- Layout -->
    <div class="section">
      <div class="section-title">Layout</div>
      
      <div class="field">
        <label>Posición</label>
        <select id="position">
          <option value="bottom-right">Abajo Derecha</option>
          <option value="bottom-left">Abajo Izquierda</option>
        </select>
      </div>

      <div class="field">
        <label>Border Radius</label>
        <input type="text" id="borderRadius" value="1.5rem">
      </div>

      <div class="field">
        <label>Altura</label>
        <input type="text" id="height" value="600px">
      </div>
    </div>

    <!-- Features -->
    <div class="section">
      <div class="section-title">Features</div>
      
      <div class="field toggle-field">
        <label>Llamada de Voz</label>
        <label class="toggle">
          <input type="checkbox" id="enableVoice" checked>
          <span class="slider"></span>
        </label>
      </div>

      <div class="field toggle-field">
        <label>Adjuntos</label>
        <label class="toggle">
          <input type="checkbox" id="enableAttachments" checked>
          <span class="slider"></span>
        </label>
      </div>

      <div class="field toggle-field">
        <label>Ubicación</label>
        <label class="toggle">
          <input type="checkbox" id="enableLocation" checked>
          <span class="slider"></span>
        </label>
      </div>
    </div>
  </aside>

  <!-- Preview Area -->
  <main class="preview-area">
    <header class="preview-header">
      <h2>Vista Previa</h2>
      <div class="preview-actions">
        <button class="btn-secondary" onclick="resetWidget()">Reset</button>
        <button class="btn-secondary" onclick="toggleWidget()">Toggle</button>
        <button class="btn-primary" onclick="copyCode()">📋 Copiar Código</button>
      </div>
    </header>

    <div class="preview-container" id="preview-container">
      <!-- Widget renders here -->
    </div>

    <div class="code-section">
      <h3>Código de Integración</h3>
      <pre id="codeOutput"></pre>
    </div>
  </main>

  <!-- Widget Script -->
  <script src="./dist/botuyo-chat.umd.js"></script>
  <script>
    // Current config
    let currentConfig = {
      apiKey: 'demo-builder',
      apiBaseUrl: 'http://127.0.0.1:9090',
      theme: {
        primaryColor: '#10b981',
        botName: 'Asistente Virtual',
        welcomeMessage: '¡Hola! 👋 ¿En qué puedo ayudarte?',
        inputPlaceholder: 'Escribe tu mensaje...',
        position: 'bottom-right',
        borderRadius: '1.5rem',
        height: '600px',
      },
      mediaConfig: {
        enableVoice: true,
        enableAttachments: true,
        enableLocation: true,
      },
      onVoiceCall: () => console.log('Voice call clicked'),
    };

    // Presets
    const presets = {
      default: {
        primaryColor: '#10b981',
        botName: 'Asistente Virtual',
      },
      dark: {
        primaryColor: '#8b5cf6',
        botName: 'Bot Oscuro',
      },
      ocean: {
        primaryColor: '#0ea5e9',
        botName: 'Asistente Ocean',
      },
      sunset: {
        primaryColor: '#f97316',
        botName: 'Bot Sunset',
      },
      forest: {
        primaryColor: '#22c55e',
        botName: 'Bot Forest',
      },
    };

    // Initialize widget
    function initWidget() {
      if (window.BotUyoChat) {
        BotUyoChat.destroy();
      }
      BotUyoChat.init(currentConfig);
      BotUyoChat.open();
      updateCodeOutput();
    }

    // Update widget with current config
    function updateWidget() {
      currentConfig.theme.primaryColor = document.getElementById('primaryColor').value;
      currentConfig.theme.botName = document.getElementById('botName').value;
      currentConfig.theme.logoUrl = document.getElementById('logoUrl').value || undefined;
      currentConfig.theme.welcomeMessage = document.getElementById('welcomeMessage').value;
      currentConfig.theme.inputPlaceholder = document.getElementById('inputPlaceholder').value;
      currentConfig.theme.position = document.getElementById('position').value;
      currentConfig.theme.borderRadius = document.getElementById('borderRadius').value;
      currentConfig.theme.height = document.getElementById('height').value;
      
      currentConfig.mediaConfig.enableVoice = document.getElementById('enableVoice').checked;
      currentConfig.mediaConfig.enableAttachments = document.getElementById('enableAttachments').checked;
      currentConfig.mediaConfig.enableLocation = document.getElementById('enableLocation').checked;

      // Reinitialize with new config
      initWidget();
    }

    // Apply preset
    function applyPreset(name) {
      const preset = presets[name];
      if (!preset) return;

      document.getElementById('primaryColor').value = preset.primaryColor;
      document.getElementById('primaryColorText').value = preset.primaryColor;
      document.getElementById('botName').value = preset.botName;

      // Update active button
      document.querySelectorAll('.preset-btn').forEach(btn => btn.classList.remove('active'));
      event.target.classList.add('active');

      updateWidget();
    }

    // Reset widget
    function resetWidget() {
      applyPreset('default');
      document.getElementById('logoUrl').value = '';
      document.getElementById('welcomeMessage').value = '¡Hola! 👋 ¿En qué puedo ayudarte?';
      document.getElementById('inputPlaceholder').value = 'Escribe tu mensaje...';
      document.getElementById('position').value = 'bottom-right';
      document.getElementById('borderRadius').value = '1.5rem';
      document.getElementById('height').value = '600px';
      document.getElementById('enableVoice').checked = true;
      document.getElementById('enableAttachments').checked = true;
      document.getElementById('enableLocation').checked = true;
      updateWidget();
    }

    // Toggle widget
    function toggleWidget() {
      if (window.BotUyoChat) {
        BotUyoChat.toggle();
      }
    }

    // Update code output
    function updateCodeOutput() {
      const code = `BotUyoChat.init({
  apiKey: 'YOUR_API_KEY',
  apiBaseUrl: 'https://api.botuyo.com',
  theme: {
    primaryColor: '${currentConfig.theme.primaryColor}',
    botName: '${currentConfig.theme.botName}',
    ${currentConfig.theme.logoUrl ? `logoUrl: '${currentConfig.theme.logoUrl}',` : ''}
    welcomeMessage: '${currentConfig.theme.welcomeMessage}',
    position: '${currentConfig.theme.position}',
    borderRadius: '${currentConfig.theme.borderRadius}',
    height: '${currentConfig.theme.height}',
  },
  mediaConfig: {
    enableVoice: ${currentConfig.mediaConfig.enableVoice},
    enableAttachments: ${currentConfig.mediaConfig.enableAttachments},
    enableLocation: ${currentConfig.mediaConfig.enableLocation},
  },
});`;
      document.getElementById('codeOutput').textContent = code;
    }

    // Copy code to clipboard
    function copyCode() {
      const code = document.getElementById('codeOutput').textContent;
      navigator.clipboard.writeText(code).then(() => {
        alert('¡Código copiado!');
      });
    }

    // Sync color inputs
    document.getElementById('primaryColor').addEventListener('input', (e) => {
      document.getElementById('primaryColorText').value = e.target.value;
      updateWidget();
    });

    document.getElementById('primaryColorText').addEventListener('change', (e) => {
      document.getElementById('primaryColor').value = e.target.value;
      updateWidget();
    });

    // Add event listeners to all inputs
    const inputs = [
      'botName', 'logoUrl', 'welcomeMessage', 'inputPlaceholder',
      'position', 'borderRadius', 'height',
      'enableVoice', 'enableAttachments', 'enableLocation'
    ];

    inputs.forEach(id => {
      const el = document.getElementById(id);
      if (el) {
        el.addEventListener('change', updateWidget);
        if (el.type === 'text') {
          el.addEventListener('input', debounce(updateWidget, 500));
        }
      }
    });

    // Debounce helper
    function debounce(func, wait) {
      let timeout;
      return function executedFunction(...args) {
        clearTimeout(timeout);
        timeout = setTimeout(() => func.apply(this, args), wait);
      };
    }

    // Initialize on load
    window.addEventListener('DOMContentLoaded', () => {
      initWidget();
    });
  </script>
</body>
</html>
