name: Deploy to Cloudflare R2

on:
  push:
    branches: [main]
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to deploy (e.g., v1, v2, latest)'
        required: false
        default: 'latest'

jobs:
  deploy:
    runs-on: ubuntu-latest
    if: "!contains(github.event.head_commit.message, '[skip ci]')"

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build widget
        run: npm run build

      - name: Verify build outputs
        run: |
          echo "📦 Build outputs:"
          ls -lah dist/*.js dist/*.css

      - name: Install Wrangler
        run: npm install -g wrangler

      - name: Extract version
        id: version
        run: |
          if [[ "${{ github.ref }}" == refs/tags/v* ]]; then
            VERSION=${GITHUB_REF#refs/tags/}
          elif [ "${{ github.event_name }}" == "workflow_dispatch" ]; then
            VERSION="${{ github.event.inputs.version }}"
          else
            VERSION="latest"
          fi
          echo "version=${VERSION}" >> $GITHUB_OUTPUT
          echo "Deploying version: ${VERSION}"

      - name: Deploy to R2
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          BUCKET="chatbot-cdn"

          echo "🚀 Deploying to R2: ${BUCKET}/${VERSION}/"

          # Deploy all JS files
          for file in dist/*.js; do
            if [ -f "$file" ]; then
              filename=$(basename "$file")
              echo "  📦 ${filename}"
              wrangler r2 object put ${BUCKET}/${VERSION}/${filename} \
                --file "$file" \
                --content-type application/javascript \
                --cache-control "public, max-age=31536000, immutable"
            fi
          done

          # Deploy all CSS files
          for file in dist/*.css; do
            if [ -f "$file" ]; then
              filename=$(basename "$file")
              echo "  🎨 ${filename}"
              wrangler r2 object put ${BUCKET}/${VERSION}/${filename} \
                --file "$file" \
                --content-type text/css \
                --cache-control "public, max-age=31536000, immutable"
            fi
          done

          echo "✅ Deployed to ${BUCKET}/${VERSION}/"

      - name: Also deploy to /latest/ (on version tags)
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          BUCKET="chatbot-cdn"
          echo "🚀 Also deploying to ${BUCKET}/latest/"

          for file in dist/*.js; do
            if [ -f "$file" ]; then
              filename=$(basename "$file")
              wrangler r2 object put ${BUCKET}/latest/${filename} \
                --file "$file" \
                --content-type application/javascript \
                --cache-control "public, max-age=3600"
            fi
          done

          for file in dist/*.css; do
            if [ -f "$file" ]; then
              filename=$(basename "$file")
              wrangler r2 object put ${BUCKET}/latest/${filename} \
                --file "$file" \
                --content-type text/css \
                --cache-control "public, max-age=3600"
            fi
          done

          echo "✅ Deployed to ${BUCKET}/latest/"

      - name: Create deployment summary
        run: |
          VERSION="${{ steps.version.outputs.version }}"

          echo "## 🚀 Deployment Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Version:** \`${VERSION}\`" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### 📦 Deployed Files" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| File | Size |" >> $GITHUB_STEP_SUMMARY
          echo "|------|------|" >> $GITHUB_STEP_SUMMARY
          for file in dist/*.js dist/*.css; do
            if [ -f "$file" ]; then
              filename=$(basename "$file")
              size=$(wc -c < "$file" | numfmt --to=iec)
              echo "| ${filename} | ${size} |" >> $GITHUB_STEP_SUMMARY
            fi
          done
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### 🔗 CDN URLs" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo '```html' >> $GITHUB_STEP_SUMMARY
          echo "<script type=\"module\" src=\"https://cdn-chatbot.botuyo.com/${VERSION}/botuyo-chat.es.js\"></script>" >> $GITHUB_STEP_SUMMARY
          echo "<link rel=\"stylesheet\" href=\"https://cdn-chatbot.botuyo.com/${VERSION}/botuyo-chat.css\">" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
