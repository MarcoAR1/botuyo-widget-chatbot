<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Paseo Libre Chatbot Widget - Demo</title>
  </head>
  <body>
    <div id="demo-page" style="padding: 40px; max-width: 800px; margin: 0 auto;">
      <h1 style="font-family: system-ui; font-size: 32px; margin-bottom: 16px;">
        Paseo Libre Chatbot Widget - Demo
      </h1>
      <p style="font-family: system-ui; font-size: 16px; line-height: 1.6; color: #666;">
        This is a demo page showing how the chatbot widget can be embedded in any website.
        Click the chat button in the bottom-right corner to start chatting!
      </p>
      
      <div style="margin-top: 32px; padding: 24px; background: #f3f4f6; border-radius: 8px;">
        <h2 style="font-family: system-ui; font-size: 20px; margin-bottom: 12px;">Try it out</h2>
        <ul style="font-family: system-ui; font-size: 14px; line-height: 1.8; color: #666;">
          <li>Send text messages</li>
          <li>Record voice messages</li>
          <li>Share images</li>
          <li>Share your location</li>
        </ul>
      </div>
    </div>

    <!-- Widget container will be inserted here by JavaScript -->
    <div id="root"></div>
    <script type="module" src="/src/demo.tsx"></script>
  </body>
</html>
