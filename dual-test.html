<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Widget Test - localhost:8080</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      margin: 0;
      padding: 40px;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      min-height: 100vh;
    }
    h1 {
      text-align: center;
      color: white;
      margin-bottom: 30px;
    }
    .info {
      max-width: 600px;
      margin: 0 auto;
      background: white;
      padding: 20px;
      border-radius: 12px;
      box-shadow: 0 10px 40px rgba(0,0,0,0.2);
    }
    .info h2 { margin-top: 0; color: #333; }
    .info p { margin: 8px 0; color: #666; }
    .status {
      padding: 10px 15px;
      border-radius: 8px;
      margin-top: 15px;
      font-weight: 500;
    }
    .status.connected { background: #d1fae5; color: #065f46; }
    .status.disconnected { background: #fee2e2; color: #991b1b; }
    .status.connecting { background: #fef3c7; color: #92400e; }
    pre {
      background: #1e1e1e;
      color: #d4d4d4;
      padding: 15px;
      border-radius: 8px;
      overflow-x: auto;
      font-size: 12px;
    }
  </style>
</head>
<body>
  <h1>🧪 Widget Test - Dual Mode (CDN + ESM)</h1>
  
  <div class="test-container" style="display: flex; gap: 20px; justify-content: center; flex-wrap: wrap;">
    <!-- CDN WIDGET CONTROL -->
    <div class="info" style="flex: 1; min-width: 300px;">
      <h2>📦 CDN Version (Global)</h2>
      <p><strong>Type:</strong> UMD/IIFE (attached to window)</p>
      <p><strong>Position:</strong> bottom-right</p>
      <div id="status-cdn" class="status connecting">⏳ Waiting for script...</div>
      <button id="btn-cdn-open" class="btn">Open</button>
      <pre id="logs-cdn" class="logs">Initializing...</pre>
    </div>

    <!-- ESM WIDGET CONTROL -->
    <div class="info" style="flex: 1; min-width: 300px;">
      <h2>⚛️ ESM Version (React Import)</h2>
      <p><strong>Type:</strong> ES Module (via import)</p>
      <p><strong>Position:</strong> bottom-left</p>
      <div id="status-esm" class="status connecting">⏳ Initializing React...</div>
      <button id="btn-esm-open" class="btn">Open</button>
      <pre id="logs-esm" class="logs">Initializing...</pre>
    </div>
  </div>

  <!-- CONTAINER FOR ESM REACT ROOT -->
  <div id="esm-root"></div>

  <!-- STYLES FOR TEST PAGE -->
  <style>
    .btn { padding: 8px 16px; background: #fff; border: 1px solid #ccc; cursor: pointer; border-radius: 4px; margin-top: 10px; }
    .logs { height: 150px; overflow-y: auto; background: #222; color: #0f0; padding: 10px; border-radius: 4px; font-size: 11px; }
  </style>

  <!-- ============================================== -->
  <!-- 1. CDN VERSION SETUP (UMD)                     -->
  <!-- ============================================== -->
  <script src="/dist/botuyo-chat.umd.js"></script>
  <script>
    (function() {
      const statusEl = document.getElementById('status-cdn');
      const logsEl = document.getElementById('logs-cdn');
      function log(msg) { logsEl.textContent = `[CDN] ${msg}\n` + logsEl.textContent; }

      const checkInterval = setInterval(() => {
        if (window.BotUyoChat) {
          clearInterval(checkInterval);
          log('Global BotUyoChat found!');
          
          try {
            window.BotUyoChat.init({
              apiKey: 'cdn-test-key',
              apiBaseUrl: 'http://127.0.0.1:9090',
              theme: {
                primaryColor: '#4f46e5', // Indigo
                botName: 'CDN Bot',
                position: 'bottom-right',
                welcomeMessage: 'Soy la versión CDN (UMD).',
                logoUrl: 'https://api.dicebear.com/7.x/bottts/svg?seed=cdn'
              },
              onConnected: (id) => {
                log(`Connected! ID: ${id}`);
                statusEl.className = 'status connected';
                statusEl.textContent = '✅ Connected';
              },
              onMessage: (msg) => log(`Msg: ${msg.content?.substring(0, 20)}...`)
            });
            
            document.getElementById('btn-cdn-open').onclick = () => window.BotUyoChat.open();

          } catch (e) {
            log(`Error: ${e.message}`);
          }
        }
      }, 100);
    })();
  </script>

  <!-- ============================================== -->
  <!-- 2. ESM VERSION SETUP (Module Import)           -->
  <!-- ============================================== -->
  <script type="module">
    import React from 'react';
    import { createRoot } from 'react-dom/client';
    import { ChatWidget } from './src/chat-widget/ChatWidget.tsx';
    import { LanguageProvider } from './src/chat-widget/i18n/LanguageContext.tsx';

    // Helper logging
    const statusEl = document.getElementById('status-esm');
    const logsEl = document.getElementById('logs-esm');
    function log(msg) { logsEl.textContent = `[ESM] ${msg}\n` + logsEl.textContent; }

    try {
      log('Mounting React Component...');
      const container = document.getElementById('esm-root');
      const root = createRoot(container);
      
      const App = () => {
        return React.createElement(LanguageProvider, {}, 
          React.createElement(ChatWidget, {
             apiKey: 'esm-test-key',
             apiBaseUrl: 'http://127.0.0.1:9090',
             theme: {
               primaryColor: '#db2777', // Pink
               botName: 'ESM Bot',
               position: 'bottom-left', // Different position
               welcomeMessage: 'Soy la versión ESM (Import).',
               logoUrl: 'https://api.dicebear.com/7.x/bottts/svg?seed=esm'
             },
             onConnected: (id) => {
                log(`Connected! ID: ${id}`);
                statusEl.className = 'status connected';
                statusEl.textContent = '✅ Connected';
             },
             onMessage: (msg) => log(`Msg: ${msg.content?.substring(0, 20)}...`)
          })
        );
      };

      root.render(React.createElement(App));
      
      // Simulate external control if needed (requires ref logic in App, simplified here)
      document.getElementById('btn-esm-open').onclick = () => log('Open clicked (Requires Ref in ESM)');

    } catch (e) {
      log(`Error: ${e.message}`);
      console.error(e);
    }
  </script>
</body>
</html>
