<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Test Simple - Chat Widget</title>
  <style>
    body {
      font-family: system-ui, sans-serif;
      padding: 2rem;
      background: #f5f5f5;
    }
    h1 {
      color: #10b981;
    }
  </style>
</head>
<body>
  <h1>🤖 Test Simple del Chat Widget</h1>
  <p>El widget debería aparecer en la esquina inferior derecha.</p>
  <button onclick="testOpen()">Test: Abrir Chat</button>
  <button onclick="testConsole()">Test: Console Log</button>

  <script type="module">
    // Importar el standalone completo que ya maneja todo
    const module = await import('./standalone.tsx');
    const PaseoLibreChat = module.default;
    
    console.log('✅ PaseoLibreChat cargado:', PaseoLibreChat);

    // Inicializar el widget
    PaseoLibreChat.init({
      apiKey: 'test-key',
      apiBaseUrl: 'http://localhost:4000',
      theme: {
        primaryColor: '#10b981',
        botName: 'Test Bot',
        position: 'bottom-right',
        welcomeMessage: '¡Hola! Soy un test.',
        inputPlaceholder: 'Escribe...',
      },
      onStateChange: (isOpen) => {
        console.log('🎯 Estado cambiado:', isOpen ? 'ABIERTO' : 'CERRADO');
      }
    });

    console.log('✅ Widget inicializado');

    window.testOpen = () => {
      console.log('🧪 Test: Llamando a PaseoLibreChat.open()');
      PaseoLibreChat.open();
    };

    window.testConsole = () => {
      console.log('🧪 Console test funcionando');
    };
  </script>
</body>
</html>
